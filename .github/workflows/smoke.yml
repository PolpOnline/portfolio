name: Smoke test

on:
  check_run:
    types: [completed]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.check_run.check_suite.head_branch }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Preview smoke test
    if: github.event.check_run.name == 'Cloudflare Pages' && github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.check_run.head_sha }}
      - name: Get preview URL
        id: preview
        env:
          SUMMARY: ${{ github.event.check_run.output.summary }}
        run: |
          url=$(printf '%s' "$SUMMARY" | grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::Could not find a preview URL in the Cloudflare Pages check summary"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Wait for preview deployment
        run: curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors "$URL" > /dev/null
        env:
          URL: ${{ steps.preview.outputs.url }}
      - name: Run smoke test
        run: bun run test:smoke
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
